[project]
name = "learnai"
version = "0.1.0"
description = "LearnAI: A Markdown repo for learning AI concepts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["loguru>=0.7.3", "mkdocs>=1.6.1", "python-dotenv>=1.2.3"]

[dependency-groups]
dev = ["indexgen>=0.1.3"]

[tool.uv.workspace]
members = ["python_tutorial"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
